<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Bricolage Grotesque','Comic Sans MS',sans-serif">
  <rect width="800" height="500" fill="#f5efe0"/>

  <text x="400" y="50" font-size="26" font-weight="900" text-anchor="middle" fill="#1a1a1a">
    POWERSHELL OBFUSCATION TIER LIST
  </text>

  <!-- Top half: rejected -->
  <g transform="translate(60,90)">
    <rect width="680" height="160" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
    <!-- crying drake -->
    <g transform="translate(30,30)">
      <circle cx="50" cy="50" r="38" fill="#fff5d6" stroke="#1a1a1a" stroke-width="3"/>
      <!-- hand covering face -->
      <path d="M14 50 Q50 30 86 50 Q70 70 50 65 Q30 70 14 50 Z" fill="#fff5d6" stroke="#1a1a1a" stroke-width="3"/>
      <!-- arrow -->
      <line x1="48" y1="30" x2="14" y2="20" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- obfuscated code -->
    <g font-family="ui-monospace, 'Courier New', monospace" font-size="11" fill="#1a1a1a">
      <text x="160" y="40">$( "{1}{0}" -f 'oami','wh' | iex )</text>
      <text x="160" y="58">[char]87+[char]104+[char]111+[char]65+[char]109+[char]105</text>
      <text x="160" y="76">&amp;("{0}{1}{2}" -f 'In','vo','ke-Expression')</text>
      <text x="160" y="94">[Convert]::FromBase64String("d2hvYW1p")</text>
      <text x="160" y="112">${{nope}}=[char[]](87,104,111,65,109,105) -join ''</text>
      <text x="160" y="130">. ([Environment]::CommandLine.Substring(...))</text>
    </g>
    <text x="640" y="80" font-size="40" text-anchor="end" fill="#d2401a" font-weight="900">✗</text>
  </g>

  <!-- Bottom half: accepted -->
  <g transform="translate(60,270)">
    <rect width="680" height="160" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
    <!-- approving drake -->
    <g transform="translate(30,30)">
      <circle cx="50" cy="50" r="38" fill="#fff5d6" stroke="#1a1a1a" stroke-width="3"/>
      <circle cx="38" cy="45" r="3" fill="#1a1a1a"/>
      <circle cx="62" cy="45" r="3" fill="#1a1a1a"/>
      <path d="M35 60 Q50 75 65 60" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- pointing finger -->
      <line x1="20" y1="30" x2="0" y2="20" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g font-family="ui-monospace, 'Courier New', monospace" font-size="22" fill="#1a1a1a">
      <text x="200" y="90" font-weight="700">whoami</text>
    </g>
    <text x="640" y="90" font-size="40" text-anchor="end" fill="#5a8f3a" font-weight="900">✓</text>
  </g>

  <text x="400" y="475" font-size="16" font-weight="700" text-anchor="middle" fill="#777">
    Somewhere in this wall of $('+')+] is a 'whoami'. Probably.
  </text>
</svg>
