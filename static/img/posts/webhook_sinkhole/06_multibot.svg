<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 234" width="760" height="234" role="img" aria-labelledby="t d"><title id="t">Multi-bot private chats by script</title><desc id="d">Horizontal bars: 54 percent of Chinese-script private chats reach two or more bots, against 15 percent for Latin script and 5 percent for Arabic.</desc><rect width="760" height="234" fill="#fdfcfa"/><g font-family="'JetBrains Mono','SF Mono',Menlo,monospace"><text x="24.0" y="32.0" font-size="15" fill="#16181a" text-anchor="start" font-weight="600">Private chats that talk to more than one bot</text><text x="24.0" y="52.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">Share of private chats with 2+ different bots, by dominant script of the text.</text><text x="100.0" y="101.0" font-size="12" fill="#16181a" text-anchor="end" font-weight="400">CJK</text><path d="M110.0,88.0 H558.5 Q562.5,88.0 562.5,92.0 V102.0 Q562.5,106.0 558.5,106.0 H110.0 Z" fill="#a3271e"/><text x="570.5" y="101.0" font-size="12" fill="#16181a" text-anchor="start" font-weight="600">54%</text><text x="614.5" y="101.0" font-size="11" fill="#797b76" text-anchor="start" font-weight="400">9,288 chats</text><text x="100.0" y="135.0" font-size="12" fill="#16181a" text-anchor="end" font-weight="400">Latin</text><path d="M110.0,122.0 H230.2 Q234.2,122.0 234.2,126.0 V136.0 Q234.2,140.0 230.2,140.0 H110.0 Z" fill="#9d9c94"/><text x="242.2" y="135.0" font-size="12" fill="#16181a" text-anchor="start" font-weight="600">15%</text><text x="286.2" y="135.0" font-size="11" fill="#797b76" text-anchor="start" font-weight="400">15,123 chats</text><text x="100.0" y="169.0" font-size="12" fill="#16181a" text-anchor="end" font-weight="400">Arabic</text><path d="M110.0,156.0 H150.2 Q154.2,156.0 154.2,160.0 V170.0 Q154.2,174.0 150.2,174.0 H110.0 Z" fill="#9d9c94"/><text x="162.2" y="169.0" font-size="12" fill="#16181a" text-anchor="start" font-weight="600">5%</text><text x="206.2" y="169.0" font-size="11" fill="#797b76" text-anchor="start" font-weight="400">16,872 chats</text><text x="110.0" y="220.0" font-size="10.5" fill="#797b76" text-anchor="start" font-weight="400">Source: raw logs; chats with at least 20 letters of text.</text></g></svg>