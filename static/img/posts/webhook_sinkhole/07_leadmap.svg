nknown-USA&quot; (UNK) and a catch-all &quot;England-UK&quot; next to</text><text x="24.0" y="546.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">the nine English regions. Canada&#x27;s territories and the two smallest Atlantic provinces are merged, the way a</text><text x="24.0" y="564.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">script splits a dataset by a region column. 26 × 83 + 42 × 4 = 2,326 files per day.</text><text x="24.0" y="620.0" font-size="10.5" fill="#797b76" text-anchor="start" font-weight="400">Source: corpus, captions of 67,459 posts in one channel. Tile layout is schematic, not geographic.</text></g></svg>