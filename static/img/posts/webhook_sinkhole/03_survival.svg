<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d"><title id="t">Survival of day-1 bots</title><desc id="d">Line chart: share of the 6,172 bots seen on day 1 that delivered again on or after each day. It falls slowly from 100 to about 85 percent by day 25 and to 53 percent by day 39.</desc><rect width="760" height="340" fill="#fdfcfa"/><g font-family="'JetBrains Mono','SF Mono',Menlo,monospace"><text x="24.0" y="32.0" font-size="15" fill="#16181a" text-anchor="start" font-weight="600">Bots from day 1 that keep delivering</text><text x="24.0" y="52.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">Of the 6,172 bots seen on day 1: share that still delivered on or after day N.</text><line x1="64" x2="640" y1="280.0" y2="280.0" stroke="#c3c2b7" stroke-width="1"/><text x="56.0" y="284.0" font-size="11" fill="#797b76" text-anchor="end" font-weight="400">0%</text><line x1="64" x2="640" y1="230.0" y2="230.0" stroke="#e1e0d9" stroke-width="1"/><text x="56.0" y="234.0" font-size="11" fill="#797b76" text-anchor="end" font-weight="400">25%</text><line x1="64" x2="640" y1="180.0" y2="180.0" stroke="#e1e0d9" stroke-width="1"/><text x="56.0" y="184.0" font-size="11" fill="#797b76" text-anchor="end" font-weight="400">50%</text><line x1="64" x2="640" y1="130.0" y2="130.0" stroke="#e1e0d9" stroke-width="1"/><text x="56.0" y="134.0" font-size="11" fill="#797b76" text-anchor="end" font-weight="400">75%</text><line x1="64" x2="640" y1="80.0" y2="80.0" stroke="#e1e0d9" stroke-width="1"/><text x="56.0" y="84.0" font-size="11" fill="#797b76" text-anchor="end" font-weight="400">100%</text><path d="M64.0,280 L64.0,80.0 L78.8,91.1 L93.5,91.8 L108.3,92.2 L123.1,92.7 L137.8,93.0 L152.6,93.6 L167.4,94.0 L182.2,94.5 L196.9,95.2 L211.7,95.8 L226.5,96.7 L241.2,97.3 L256.0,98.4 L270.8,99.0 L285.5,99.5 L300.3,100.2 L315.1,100.8 L329.8,101.8 L344.6,102.4 L359.4,103.3 L374.2,103.9 L388.9,104.6 L403.7,105.4 L418.