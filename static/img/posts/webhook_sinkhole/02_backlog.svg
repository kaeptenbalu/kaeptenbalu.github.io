<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="t d"><title id="t">Message age at delivery, day 1 vs day 2</title><desc id="d">Stacked bars: on day 1, 31 percent of messages arrived within a minute, 3 percent within an hour and 66 percent were 1 to 24 hours old. On day 2, essentially all arrived within a minute.</desc><rect width="760" height="250" fill="#fdfcfa"/><g font-family="'JetBrains Mono','SF Mono',Menlo,monospace"><text x="24.0" y="32.0" font-size="15" fill="#16181a" text-anchor="start" font-weight="600">How old the messages were when they arrived</text><text x="24.0" y="52.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">Share of message and channel_post updates by delivery delay.</text><rect x="96" y="70" width="12" height="12" rx="2" fill="#86b6ef"/><text x="114.0" y="80.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">under 1 minute</text><rect x="238.8" y="70" width="12" height="12" rx="2" fill="#3987e5"/><text x="256.8" y="80.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">1 minute – 1 hour</text><rect x="403.20000000000005" y="70" width="12" height="12" rx="2" fill="#184f95"/><text x="421.2" y="80.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">1 – 24 hours</text><text x="86.0" y="121.0" font-size="12" fill="#16181a" text-anchor="end" font-weight="400">day 1</text><rect x="96.0" y="104" width="198.0" height="24" fill="#86b6ef"/><text x="195.0" y="120.0" font-size="11" fill="#16181a" text-anchor="middle" font-weight="600">31%</text><rect x="296.0" y="104" width="18.1" height="24" fill="#3987e5"/><rect x="316.1" y="104" width="419.9" height="24" fill="#184f95"/><text x="526.1" y="120.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">66%</text><text x="86.0" y="169.0" font-size="12" fill="#16181a" text-anchor="end" font-weight="400">day 2</text><rect x="96.0" y="152" width="637.8" height="24" fill="#86b6ef"/><text x="414.9" y="168.0" font-size="11" fill="#16181a" text-anchor="middle" font-weight="600">100%</text><text x="96.0" y="206.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">Day 2 onwards: more than 99.9% arrive within 10 seconds.</text><text x="96.0" y="234.0" font-size="10.5" fill="#797b76" text-anchor="start" font-weight="400">Source: raw logs, receive time minus message.date.</text></g></svg>