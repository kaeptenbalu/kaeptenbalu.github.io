<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Bricolage Grotesque','Comic Sans MS',sans-serif">
  <rect width="800" height="500" fill="#f5efe0"/>

  <text x="400" y="50" font-size="26" font-weight="900" text-anchor="middle" fill="#1a1a1a">
    WHEN YOUR THREAT FEED
  </text>
  <text x="400" y="82" font-size="26" font-weight="900" text-anchor="middle" fill="#d2401a">
    GETS A LITTLE TOO CLINGY
  </text>

  <!-- Phone mockup -->
  <g transform="translate(280,120)">
    <rect width="240" height="360" rx="28" fill="#1a1a1a"/>
    <rect x="10" y="10" width="220" height="340" rx="20" fill="#fff"/>
    <!-- notch -->
    <rect x="95" y="10" width="50" height="12" rx="6" fill="#1a1a1a"/>
    <!-- status bar -->
    <text x="20" y="44" font-size="11" font-weight="700" fill="#1a1a1a">03:47</text>
    <text x="220" y="44" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="end">📶 🔋</text>

    <!-- Notification 1 -->
    <g transform="translate(15,60)">
      <rect width="210" height="68" rx="10" fill="#f0f0f0"/>
      <rect x="10" y="10" width="22" height="22" rx="4" fill="#5b5fc7"/>
      <text x="18" y="26" font-size="14" font-weight="900" fill="#fff">T</text>
      <text x="42" y="22" font-size="11" font-weight="700" fill="#777">SubCrawl • now</text>
      <text x="42" y="40" font-size="12" font-weight="900" fill="#1a1a1a">Hey... u up? 👀</text>
      <text x="42" y="58" font-size="11" fill="#444">i found something juicy</text>
    </g>

    <!-- Notification 2 -->
    <g transform="translate(15,140)">
      <rect width="210" height="68" rx="10" fill="#f0f0f0"/>
      <rect x="10" y="10" width="22" height="22" rx="4" fill="#5b5fc7"/>
      <text x="18" y="26" font-size="14" font-weight="900" fill="#fff">T</text>
      <text x="42" y="22" font-size="11" font-weight="700" fill="#777">SubCrawl • 03:48</text>
      <text x="42" y="40" font-size="12" font-weight="900" fill="#1a1a1a">srsly. it's a banger.</text>
      <text x="42" y="58" font-size="11" fill="#444">qakbot panel + open dir</text>
    </g>

    <!-- Notification 3 -->
    <g transform="translate(15,220)">
      <rect width="210" height="68" rx="10" fill="#f0f0f0"/>
      <rect x="10" y="10" width="22" height="22" rx="4" fill="#5b5fc7"/>
      <text x="18" y="26" font-size="14" font-weight="900" fill="#fff">T</text>
      <text x="42" y="22" font-size="11" font-weight="700" fill="#777">SubCrawl • 03:49</text>
      <text x="42" y="40" font-size="12" font-weight="900" fill="#1a1a1a">hello?</text>
      <text x="42" y="58" font-size="11" fill="#444">k. i'll just keep crawling.</text>
    </g>

    <!-- Notification 4 -->
    <g transform="translate(15,300)">
      <rect width="210" height="40" rx="10" fill="#fff5d6"/>
      <rect x="10" y="9" width="22" height="22" rx="4" fill="#5b5fc7"/>
      <text x="18" y="25" font-size="14" font-weight="900" fill="#fff">T</text>
      <text x="42" y="22" font-size="11" font-weight="700" fill="#777">SubCrawl • 03:50</text>
      <text x="42" y="36" font-size="11" fill="#444">📎 misp_event.json</text>
    </g>
  </g>

  <!-- Server character on the left -->
  <g transform="translate(80,250)">
    <rect width="100" height="120" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
    <line x1="0" y1="40" x2="100" y2="40" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="0" y1="80" x2="100" y2="80" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="20" cy="20" r="4" fill="#5fcf72"/>
    <circle cx="35" cy="20" r="4" fill="#d2401a"/>
    <!-- face on middle row -->
    <circle cx="35" cy="60" r="4" fill="#1a1a1a"/>
    <circle cx="65" cy="60" r="4" fill="#1a1a1a"/>
    <path d="M30 100 Q50 85 70 100" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- arms -->
    <line x1="0" y1="60" x2="-30" y2="50" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="60" x2="130" y2="50" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="130" y="220" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">
    SubCrawl
  </text>
  <text x="130" y="410" font-size="12" font-style="italic" text-anchor="middle" fill="#777">
    (just needs to talk)
  </text>
</svg>
