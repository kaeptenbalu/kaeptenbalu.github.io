<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Bricolage Grotesque','Comic Sans MS',sans-serif">
  <rect width="800" height="500" fill="#f5efe0"/>

  <text x="400" y="50" font-size="26" font-weight="900" text-anchor="middle" fill="#1a1a1a">
    MALWARE'S ONE WEAKNESS:
  </text>

  <!-- Panel 1 -->
  <g transform="translate(80,100)">
    <rect width="280" height="280" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
    <text x="140" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#777">BEFORE</text>
    <!-- happy file -->
    <g transform="translate(70,60)">
      <path d="M0 0 L100 0 L140 40 L140 180 L0 180 Z" fill="#fff5d6" stroke="#1a1a1a" stroke-width="3"/>
      <path d="M100 0 L100 40 L140 40 Z" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
      <!-- happy face -->
      <circle cx="55" cy="90" r="4" fill="#1a1a1a"/>
      <circle cx="90" cy="90" r="4" fill="#1a1a1a"/>
      <path d="M50 115 Q72 135 95 115" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- filename tag -->
      <rect x="10" y="150" width="120" height="20" rx="3" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
      <text x="70" y="165" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Comp_X_k.lnk</text>
    </g>
  </g>

  <!-- Arrow -->
  <g transform="translate(380,230)">
    <text x="20" y="-10" font-size="12" font-weight="700" text-anchor="middle" fill="#d2401a">SANDBOX</text>
    <line x1="0" y1="10" x2="40" y2="10" stroke="#1a1a1a" stroke-width="4"/>
    <polygon points="40,4 52,10 40,16" fill="#1a1a1a"/>
  </g>

  <!-- Panel 2 -->
  <g transform="translate(450,100)">
    <rect width="280" height="280" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
    <text x="140" y="30" font-size="14" font-weight="700" text-anchor="middle" fill="#777">AFTER</text>
    <!-- sad file -->
    <g transform="translate(70,60)">
      <path d="M0 0 L100 0 L140 40 L140 180 L0 180 Z" fill="#fff5d6" stroke="#1a1a1a" stroke-width="3"/>
      <path d="M100 0 L100 40 L140 40 Z" fill="#fff" stroke="#1a1a1a" stroke-width="3"/>
      <!-- sad face -->
      <line x1="50" y1="85" x2="60" y2="95" stroke="#1a1a1a" stroke-width="3"/>
      <line x1="60" y1="85" x2="50" y2="95" stroke="#1a1a1a" stroke-width="3"/>
      <line x1="85" y1="85" x2="95" y2="95" stroke="#1a1a1a" stroke-width="3"/>
      <line x1="95" y1="85" x2="85" y2="95" stroke="#1a1a1a" stroke-width="3"/>
      <path d="M50 130 Q72 110 95 130" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- filename tag - crossed out -->
      <rect x="10" y="150" width="120" height="20" rx="3" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
      <text x="70" y="165" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">sample.exe</text>
      <line x1="20" y1="170" x2="120" y2="155" stroke="#d2401a" stroke-width="2"/>
    </g>
    <text x="140" y="265" font-size="13" font-weight="700" text-anchor="middle" fill="#d2401a">"I can't work like this."</text>
  </g>

  <text x="400" y="470" font-size="22" font-weight="900" text-anchor="middle" fill="#d2401a">
    BEING CALLED THE WRONG NAME
  </text>
</svg>
