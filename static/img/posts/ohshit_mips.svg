<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Bricolage Grotesque','Comic Sans MS',sans-serif">
  <rect width="800" height="500" fill="#f5efe0"/>

  <text x="400" y="48" font-size="22" font-weight="900" text-anchor="middle" fill="#1a1a1a">
    STATE-OF-THE-ART MALWARE STRING ENCRYPTION (2026):
  </text>

  <!-- Treasure chest with strings escaping -->
  <g transform="translate(140,150)">
    <!-- chest base body -->
    <rect x="0" y="70" width="320" height="190" rx="8" fill="#8b6231" stroke="#1a1a1a" stroke-width="3"/>
    <!-- wood planks -->
    <line x1="0" y1="110" x2="320" y2="110" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="0" y1="180" x2="320" y2="180" stroke="#1a1a1a" stroke-width="2"/>
    <!-- metal trim -->
    <rect x="-4" y="68" width="328" height="10" rx="2" fill="#5a3e1c" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="-4" y="252" width="328" height="10" rx="2" fill="#5a3e1c" stroke="#1a1a1a" stroke-width="2"/>

    <!-- chest lid (open) -->
    <path d="M-4 70 Q-4 -30 160 -30 Q324 -30 324 70 L310 70 Q310 -10 160 -10 Q10 -10 10 70 Z"
          fill="#7a5328" stroke="#1a1a1a" stroke-width="3"/>
    <!-- lid hinge -->
    <rect x="0" y="60" width="320" height="12" rx="2" fill="#3a2818" stroke="#1a1a1a" stroke-width="2"/>

    <!-- strings spilling out of the chest -->
    <g font-family="ui-monospace, 'Courier New', monospace" font-weight="700">
      <text x="30" y="35" font-size="16" fill="#d2401a" transform="rotate(-12 30 35)">genddos.st</text>
      <text x="135" y="10" font-size="14" fill="#1a1a1a" transform="rotate(-3 135 10)">PRIVMSG</text>
      <text x="220" y="25" font-size="14" fill="#1a1a1a" transform="rotate(8 220 25)">KILLATTK</text>
      <text x="70" y="60" font-size="13" fill="#1a1a1a" transform="rotate(-6 70 60)">GETLOCALIP</text>
      <text x="190" y="58" font-size="13" fill="#1a1a1a" transform="rotate(4 190 58)">/dev/watchdog</text>
      <text x="40" y="98" font-size="12" fill="#1a1a1a" opacity="0.55">/etc/rc.d/rc.local</text>
      <text x="200" y="98" font-size="12" fill="#1a1a1a" opacity="0.55">/proc/net/tcp</text>
    </g>

    <!-- broken padlock dangling from the hinge -->
    <g transform="translate(150,255)">
      <!-- chain -->
      <line x1="0" y1="0" x2="0" y2="18" stroke="#1a1a1a" stroke-width="3"/>
      <!-- shackle (snapped) -->
      <path d="M-12 18 L-12 32" stroke="#c89a3a" stroke-width="4" fill="none"/>
      <path d="M12 18 Q12 8 0 8" stroke="#c89a3a" stroke-width="4" fill="none"/>
      <!-- lock body -->
      <rect x="-18" y="32" width="36" height="30" rx="4" fill="#c89a3a" stroke="#1a1a1a" stroke-width="2.5"/>
      <text x="0" y="46" font-size="9" font-weight="900" text-anchor="middle" fill="#1a1a1a">XOR</text>
      <text x="0" y="58" font-size="11" font-weight="900" text-anchor="middle" fill="#1a1a1a">0x22</text>
      <!-- crack line indicating broken -->
      <line x1="-12" y1="36" x2="6" y2="58" stroke="#1a1a1a" stroke-width="2"/>
    </g>
  </g>

  <!-- Analyst on the right -->
  <g transform="translate(620,290)">
    <!-- head -->
    <circle cx="0" cy="0" r="28" fill="#fff5d6" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="-9" cy="-4" r="3" fill="#1a1a1a"/>
    <circle cx="9" cy="-4" r="3" fill="#1a1a1a"/>
    <!-- straight mouth (unimpressed) -->
    <line x1="-9" y1="14" x2="9" y2="14" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- body -->
    <line x1="0" y1="28" x2="0" y2="90" stroke="#1a1a1a" stroke-width="3"/>
    <!-- arms (one holding up the broken lock) -->
    <line x1="0" y1="45" x2="-32" y2="60" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="45" x2="34" y2="68" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <!-- legs -->
    <line x1="0" y1="90" x2="-18" y2="128" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="90" x2="18" y2="128" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>

    <!-- speech bubble -->
    <g transform="translate(-210,-78)">
      <path d="M0 0 L185 0 L185 56 L60 56 L40 76 L42 56 L0 56 Z" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/>
      <text x="92" y="24" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">...that's the encryption?</text>
      <text x="92" y="44" font-size="13" font-weight="900" text-anchor="middle" fill="#d2401a">ONE byte?</text>
    </g>
  </g>

  <text x="400" y="455" font-size="20" font-weight="900" text-anchor="middle" fill="#d2401a">
    ONE (1) BYTE OF KEY MATERIAL.
  </text>
  <text x="400" y="478" font-size="13" font-style="italic" text-anchor="middle" fill="#777">
    yes, that is the whole encryption. yes, really.
  </text>
</svg>
