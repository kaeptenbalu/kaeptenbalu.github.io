openapi: 3.1.0
info:
  title: Telegram Threat-Intelligence Feed
  version: "1.0.0"
  summary: Read-only feed of Telegram bots abused by malware.
  description: |
    **Base URL: `https://ti.mboll.eu`** — every REST endpoint lives under `/v1`,
    e.g. `https://ti.mboll.eu/v1/records`. Authenticate with the `X-API-Key` header;
    access and terms of use are explained in the [guide](https://www.mboll.eu/api/).

    ## Quick start

    ```bash
    curl -G "https://ti.mboll.eu/v1/records" \
      -H "X-API-Key: YOUR_API_KEY" \
      --data-urlencode 'filter=created >= @todayStart' \
      --data-urlencode 'sort=-created' \
      --data-urlencode 'perPage=100'
    ```

    ## Understanding the data

    Everything starts with an **observation**: a malware sample in which a bot token — and, where observed, a chat ID — is hard-coded. Around it the data is organised in entities:

    | Entity | Key | What it holds |
    |---|---|---|
    | **Sample** | `sha256` | first VirusTotal submission, malware family, sandbox link |
    | **Bot** | `bot_id` (number before `:` in the token) | current username, description, commands, webhook — stable even if the operator rotates the token |
    | **Token** | `token` | which bot it belongs to; **liveness re-checked daily** (alive / dead, first and last seen alive) |
    | **Chat** | `chat_id` | the exfiltration chat: type, title, description, admins incl. usernames, member count; **re-checked daily** |
    | **History** | `bot_id` / `chat_id` | changed webhooks, descriptions, titles, admins, chat migrations, … |

    A **token + chat** pair is an exfiltration **channel**: everything a sample sends via this token ends up in this chat. Samples, bots and chats repeat across observations, so treat the data as a **graph** (sample —uses→ token —exfiltrates-to→ chat), not a flat table:

    - **Sample ↔ Bot** — a sample may ship several tokens (fallback / rotation); a bot is reused across many builds and samples.
    - **Bot ↔ Chat** — operators funnel **many bots into one chat/channel**.
    - **Operator ↔ Bots** — the same creator (`admins`) runs many bots.

    The REST API offers both views: **`/v1/records`** — one row per observation with sample, bot and chat data merged in — and the entity endpoints `/v1/samples`, `/v1/bots`, `/v1/tokens`, `/v1/chats`, `/v1/bot-history`, `/v1/chat-history`, joined by the keys above. The [MISP feed](/api/misp/) groups everything per bot and channel.

    `private`, `bot_name` and `permissions` in `/v1/records` describe the token **at the time the sample was collected**; the current state of a token is in `/v1/tokens`.

    ## Pivoting and clustering

    The data ships **no pre-computed cluster label** — commodity malware is used by many independent operators, so automatic transitive clustering chains unrelated actors together. **Correlate locally** over the natural join keys; your own labels then stay stable across days:

    | Group by | Gives you |
    |---|---|
    | `malware_file_hash` / `sha256` | all bots a given sample used |
    | `bot_id` | all samples / builds using that bot, across token rotations |
    | `source_chat_id` / `chat_id` | bots sharing a drop channel → same operator / campaign |
    | `admins` (the `creator`) | operator attribution across bots |
    | `relay_account` | Cloudflare Worker relays run by the same account |
    | `webhook`, `menu_webapp_url`, `bot_description` | shared infrastructure, MaaS templates, seller handles, referral codes |

    Beware of **shared tokens**: some tokens appear in hundreds of samples across many malware families — builder defaults or leaked tokens used by independent actors. They are valid indicators, but not a basis for attribution (the MISP feed flags them as `shared-suspected`).

    Where an observation has been tied to a **named investigation or public report** by a bot, chat or token match, it carries `investigation_name` / `investigation_url`.

    ## Update schedule

    All times Europe/Berlin (UTC+1 in winter, UTC+2 in summer).

    | Time | What changes |
    |---|---|
    | **15:00 – ~00:45** | Main pipeline: new observations, malware families, bot / chat enrichment, sandbox links → `/v1/records` and all entity endpoints |
    | **~00:45 – ~03:00** | Token liveness re-check → `/v1/tokens` (status, last seen alive) |
    | **~03:00 – ~03:20** | Chat check → `/v1/chats`, `/v1/chat-history` |
    | **~03:20** | MISP feed regenerated |

    - **Recommended pull window: 04:00 – 14:30** — the daily run is complete and all data, including token and chat status, reflects the same state. Token and chat status do not change in this window; only occasionally a few observations from relay analysis (~10:00) are added.
    - **Avoid pulling while the pipeline runs** (15:00 – ~03:30): observations exist before their enrichment is complete, and token / chat status is being updated.
    - **Pull incrementally:** remember the newest `created` value you have seen and request `filter=created > "<that value>"` with `sort=created`.

    ## Versioning

    Within `v1` the response format and field semantics stay stable — fields may be
    added, never silently changed; a breaking change would ship as `/v2` with an
    overlap period.

    **Legacy path:** `/api/collections/Telegram/records` answers like `/v1/records`
    but is **deprecated and will be switched off on 1 December 2026** — please use
    `/v1/records`.

    ## MISP feed

    The same data is available as a MISP feed under `/misp/` with the same key —
    setup guide, object template and taxonomy: [MISP feed](https://www.mboll.eu/api/misp/).

servers:
  - url: https://ti.mboll.eu
    description: Production (requires a valid X-API-Key)

security:
  - ApiKey: []

tags:
  - name: Records
    description: |
      The flat feed: one record per observed link between a malware sample, a bot
      token and (where observed) a chat, with sample, bot and chat data merged in.
  - name: Samples
    description: One entry per malware sample. Join key `sha256` (= `malware_file_hash` in records).
  - name: Bots
    description: |
      One entry per bot (current state). Join key `bot_id` — the number before the
      colon of a token; stable even if the operator rotates the token secret.
  - name: Tokens
    description: |
      One entry per token string, with liveness over time (re-checked daily).
      Join keys `token` (= `bot_token` in records) and `bot_id`.
  - name: Chats
    description: One entry per exfiltration chat (current state). Join key `chat_id` (= `source_chat_id` in records).
  - name: History
    description: |
      Changes over time. `bot-history` records replaced bot values (webhook,
      description, commands, username); `chat-history` records chat events (title,
      description, photo, pinned message, admins, migration, chat gone/restored).
      For events reconstructed from data collected before November 2026,
      `detected_at` is the last time the old value was seen.

  - name: MISP feed
    description: |
      Static files of the MISP feed (one event per bot), regenerated daily around 03:20
      Europe/Berlin. Configure it in MISP as feed type *MISP Feed* with the URL
      `https://ti.mboll.eu/misp` and the header `X-API-Key` — step-by-step guide:
      [MISP feed](https://www.mboll.eu/api/misp/). The feed files have their own,
      higher rate limit for the initial synchronisation.

paths:
  /v1/records:
    get:
      tags: [Records]
      operationId: listRecords
      summary: List / search records
      description: |
        Returns a paginated list of records. Combine `filter`, `sort` and `fields`
        to search and to keep responses small.
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
        - $ref: "#/components/parameters/filter"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/fields"
        - $ref: "#/components/parameters/skipTotal"
      responses:
        "200":
          description: A page of records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordList"
              examples:
                default:
                  $ref: "#/components/examples/RecordListExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/records/{id}:
    get:
      tags: [Records]
      operationId: getRecord
      summary: Get a single record
      parameters:
        - name: id
          in: path
          required: true
          description: Record ID (15 characters, `[a-z0-9]`).
          schema:
            type: string
            pattern: "^[a-z0-9]{15}$"
          example: 6wt5fl4nyzq8n1u
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: The record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No record with this ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/samples:
    get:
      tags: [Samples]
      operationId: listSamples
      summary: List / search samples
      description: |
        Same paging, filter, sort and field-selection rules as `/v1/records`.

        Examples: `filter=sha256 = "e636c2bcfe5215b07ac6bbd83e8292c62fbf1e36354f57645278ddc040a15de7"` · `filter=families ~ "stealer"`
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
        - $ref: "#/components/parameters/filterEntity"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/fields"
        - $ref: "#/components/parameters/skipTotal"
      responses:
        "200":
          description: A page of samples
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Sample" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/samples/{id}:
    get:
      tags: [Samples]
      operationId: getSamples
      summary: Get a single sample
      parameters:
        - name: id
          in: path
          required: true
          description: Entry ID (15 characters, `[a-z0-9]`) as returned in a list response.
          schema: { type: string, pattern: "^[a-z0-9]{15}$" }
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: The sample
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sample" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No entry with this ID }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/bots:
    get:
      tags: [Bots]
      operationId: listBots
      summary: List / search bots
      description: |
        Same paging, filter, sort and field-selection rules as `/v1/records`.

        Examples: `filter=bot_id = "8122935411"` · `filter=webhook != ""`
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
        - $ref: "#/components/parameters/filterEntity"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/fields"
        - $ref: "#/components/parameters/skipTotal"
      responses:
        "200":
          description: A page of bots
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Bot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/bots/{id}:
    get:
      tags: [Bots]
      operationId: getBots
      summary: Get a single bot
      parameters:
        - name: id
          in: path
          required: true
          description: Entry ID (15 characters, `[a-z0-9]`) as returned in a list response.
          schema: { type: string, pattern: "^[a-z0-9]{15}$" }
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: The bot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bot" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No entry with this ID }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/tokens:
    get:
      tags: [Tokens]
      operationId: listTokens
      summary: List / search tokens
      description: |
        Same paging, filter, sort and field-selection rules as `/v1/records`.

        Examples: `filter=bot_id = "8122935411"` · `filter=status = "ok"`
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
        - $ref: "#/components/parameters/filterEntity"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/fields"
        - $ref: "#/components/parameters/skipTotal"
      responses:
        "200":
          description: A page of tokens
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Token" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/tokens/{id}:
    get:
      tags: [Tokens]
      operationId: getTokens
      summary: Get a single token
      parameters:
        - name: id
          in: path
          required: true
          description: Entry ID (15 characters, `[a-z0-9]`) as returned in a list response.
          schema: { type: string, pattern: "^[a-z0-9]{15}$" }
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: The token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Token" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No entry with this ID }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/chats:
    get:
      tags: [Chats]
      operationId: listChats
      summary: List / search chats
      description: |
        Same paging, filter, sort and field-selection rules as `/v1/records`.

        Examples: `filter=chat_id = "-1001614217318"` · `filter=admins ~ ":creator" && user_count > 10`
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
        - $ref: "#/components/parameters/filterEntity"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/fields"
        - $ref: "#/components/parameters/skipTotal"
      responses:
        "200":
          description: A page of chats
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Chat" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/chats/{id}:
    get:
      tags: [Chats]
      operationId: getChats
      summary: Get a single chat
      parameters:
        - name: id
          in: path
          required: true
          description: Entry ID (15 characters, `[a-z0-9]`) as returned in a list response.
          schema: { type: string, pattern: "^[a-z0-9]{15}$" }
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: The chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No entry with this ID }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/bot-history:
    get:
      tags: [History]
      operationId: listBotHistory
      summary: List / search bot history
      description: |
        Same paging, filter, sort and field-selection rules as `/v1/records`.

        Examples: `filter=bot_id = "6205694016"` · `filter=event_type = "webhook_changed"`
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
        - $ref: "#/components/parameters/filterEntity"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/fields"
        - $ref: "#/components/parameters/skipTotal"
      responses:
        "200":
          description: A page of bot history events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/BotHistoryEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/bot-history/{id}:
    get:
      tags: [History]
      operationId: getBotHistory
      summary: Get a single bot history event
      parameters:
        - name: id
          in: path
          required: true
          description: Entry ID (15 characters, `[a-z0-9]`) as returned in a list response.
          schema: { type: string, pattern: "^[a-z0-9]{15}$" }
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: The bot history event
          content:
