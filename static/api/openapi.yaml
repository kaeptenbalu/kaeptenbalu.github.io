        "404": { description: No entry with this ID }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/chat-history:
    get:
      tags: [History]
      operationId: listChatHistory
      summary: List / search chat history
      description: |
        Same paging, filter, sort and field-selection rules as `/v1/records`.

        Examples: `filter=chat_id = "-1001868255344"` · `filter=event_type = "chat_migrated"`
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/perPage"
        - $ref: "#/components/parameters/filterEntity"
        - $ref: "#/components/parameters/sort"
        - $ref: "#/components/parameters/fields"
        - $ref: "#/components/parameters/skipTotal"
      responses:
        "200":
          description: A page of chat history events
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ChatHistoryEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/chat-history/{id}:
    get:
      tags: [History]
      operationId: getChatHistory
      summary: Get a single chat history event
      parameters:
        - name: id
          in: path
          required: true
          description: Entry ID (15 characters, `[a-z0-9]`) as returned in a list response.
          schema: { type: string, pattern: "^[a-z0-9]{15}$" }
        - $ref: "#/components/parameters/fields"
      responses:
        "200":
          description: The chat history event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatHistoryEvent" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No entry with this ID }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /misp/manifest.json:
    get:
      tags: [MISP feed]
      operationId: mispManifest
      summary: Feed manifest (index of all events)
      description: |
        MISP feed index: event UUID → info, date, tags and `timestamp`. MISP compares the
        timestamps and downloads only new or changed events.
      responses:
        "200": { description: Manifest, content: { application/json: { schema: { type: object } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /misp/{uuid}.json:
    get:
      tags: [MISP feed]
      operationId: mispEvent
      summary: One MISP event (one Telegram bot)
      description: |
        Standard MISP event JSON with `telegram-bot` objects (one per channel = token + chat),
        `telegram-account` objects, the Bot API endpoint and the event report „Overview“.
        Removed items are delivered with `deleted: true` for 30 days.
      parameters:
        - name: uuid
          in: path
          required: true
          description: Event UUID from the manifest (stable per bot).
          schema: { type: string, format: uuid }
      responses:
        "200": { description: MISP event, content: { application/json: { schema: { type: object } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No event with this UUID }
  /misp/hashes.csv:
    get:
      tags: [MISP feed]
      operationId: mispHashes
      summary: Value hashes for MISP feed caching
      description: "`md5(value),event-uuid` per line — used by MISP's feed cache for correlation without import."
      responses:
        "200": { description: CSV, content: { text/csv: { schema: { type: string } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Your personal API key. Missing or invalid key → `403`.
        Keys are per partner and must not be shared.

  parameters:
    page:
      name: page
      in: query
      description: Page number (1-based).
      schema: { type: integer, minimum: 1, default: 1 }
    perPage:
      name: perPage
      in: query
      description: Records per page. Values above 1000 are capped at 1000.
      schema: { type: integer, minimum: 1, maximum: 1000, default: 30 }
    filterEntity:
      name: filter
      in: query
      description: |
        Filter expression, same syntax as for `/v1/records` (quote string values,
        URL-encode the expression). See the endpoint description for examples.
      schema: { type: string }
    filter:
      name: filter
      in: query
      description: |
        Filter expression. **URL-encode it** (e.g. `curl -G --data-urlencode`).

        - Operators: `=` `!=` `>` `>=` `<` `<=` `~` (contains, case-insensitive)
          `!~` (does not contain)
        - Combine with `&&`, `||` and parentheses
        - **String values must be quoted**: `families ~ "asyncrat"` — unquoted
          values return `400`
        - Dates are UTC, format `"YYYY-MM-DD HH:MM:SS"`; macros `@now`,
          `@todayStart`, `@monthStart`, `@yearStart`
        - Rolling windows ("last 10 days") cannot be computed in the filter —
          compute the date on your side and pass it as an absolute value
      schema: { type: string }
      examples:
        today:
          summary: Records added to the feed today
          value: created >= @todayStart
        family:
          summary: One malware family
          value: families ~ "asyncrat"
        chat:
          summary: All bots exfiltrating to one chat (same operator)
          value: source_chat_id = "5283662956"
        live:
          summary: Tokens that were still valid when last validated
          value: private = false
        sample:
          summary: All bots used by one sample
          value: malware_file_hash = "e636c2bcfe5215b07ac6bbd83e8292c62fbf1e36354f57645278ddc040a15de7"
        incremental:
          summary: Incremental sync since your last pull
          value: created > "2026-11-09 00:00:00"
    sort:
      name: sort
      in: query
      description: |
        Comma-separated field names; prefix `-` for descending.
        Examples: `-created`, `first_seen`, `-first_seen,bot_name`.
      schema: { type: string }
      example: -created
    fields:
      name: fields
      in: query
      description: Comma-separated list of fields to return (keeps responses small).
      schema: { type: string }
      example: bot_name,bot_token,families,first_seen
    skipTotal:
      name: skipTotal
      in: query
      description: |
        If `true`, `totalItems` and `totalPages` are not computed (returned as `-1`)
        — noticeably faster for large paged exports.
      schema: { type: boolean, default: false }

  responses:
    BadRequest:
      description: Invalid filter or sort expression (most often an unquoted string value).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            status: 400
            message: Something went wrong while processing your request.
            data: {}
    Forbidden:
      description: |
        Missing or invalid `X-API-Key`, a method other than `GET`, or a path outside
        the documented endpoints. Plain-text body.
      content:
        text/plain:
          schema: { type: string }
          example: Forbidden - valid X-API-Key required (read-only Telegram feed)
    TooManyRequests:
      description: |
        Rate limit exceeded: **30 requests per minute per key**. Back off and retry
        after about 60 seconds. Higher limits are available on request.

  schemas:
    Error:
      type: object
      properties:
        status: { type: integer }
        message: { type: string }
        data: { type: object }

    RecordList:
      type: object
      required: [page, perPage, totalItems, totalPages, items]
      properties:
        page: { type: integer, example: 1 }
        perPage: { type: integer, example: 2 }
        totalItems:
          type: integer
          description: Total matching records (`-1` with `skipTotal=true`).
          example: 56942
        totalPages:
          type: integer
          description: Total pages (`-1` with `skipTotal=true`).
          example: 28471
        items:
          type: array
          items: { $ref: "#/components/schemas/Record" }

    Record:
      type: object
      description: |
        A feed record. Empty strings / `0` mean "not observed / not retrievable",
        not a real value.
      properties:
        id:
          type: string
          description: Record ID.
          example: 6wt5fl4nyzq8n1u
        collectionId:
          type: string
          description: Internal collection ID (constant).
        collectionName:
          type: string
          description: Always `Telegram`.
          example: Telegram

        bot_token:
          type: string
          description: |
            Observed bot API token, stored as `bot<bot_id>:<secret>`. The numeric
            `bot_id` before the colon is stable for a bot even if the operator
            rotates the secret — use it as the bot's join key.
          example: "bot8122935411:AAH…"
        bot_name:
          type: string
          description: |
            Bot username from `getMe`. **`PRIVATE_BOT` means the token was already
            invalid (HTTP 401) when we first validated it**, so no username could be
            retrieved.
          example: anuZSteel_bot
        private:
          type: boolean
          description: |
            **`true` = the token is dead / revoked**: Telegram answered `getMe` with
            HTTP 401 at validation time. `false` = the token was valid at that time.
            This is **not** the bot's privacy mode — that is in `permissions`.
        permissions:
          type: string
          description: |
            The bot's own `getMe` flags, verbatim:
            `can_read_all_group_messages=<true|false> can_join_groups=<true|false>`.
            `can_read_all_group_messages=true` means privacy mode is **off**.
            `unknown` when the token was already dead.
          example: can_read_all_group_messages=false can_join_groups=true
        api_methods:
          type: string
          description: |
            Space-separated Bot API methods the sample actually calls, e.g.
            `sendDocument sendMessage` — indicates exfiltration style / C2 capability.
          example: sendDocument sendMessage

        malware_file_hash:
          type: string
          description: SHA-256 of the malware sample containing the token.
          example: e636c2bcfe5215b07ac6bbd83e8292c62fbf1e36354f57645278ddc040a15de7
        first_seen:
          type: string
          format: date-time
          description: |
            First submission of the **sample** to VirusTotal (its age, UTC) — **not**
            the date we discovered it (that is `created`).
          example: "2025-05-10 20:58:16.000Z"
        families:
          type: string
          description: Suggested malware family label from VirusTotal, e.g. `trojan.msil/asyncrat`. Empty if VT has no consensus label.
          example: trojan.msil/asyncrat
        threat_categories:
          type: string
          description: Comma-separated VirusTotal threat categories, e.g. `trojan, stealer`.
          example: trojan
        triage:
          type: string
          description: |
            URL of a [tria.ge](https://tria.ge) analysis of this sample, matched by
            hash. Empty if the sample is not on tria.ge.
          example: https://tria.ge/260824-3lmc7szzdz

        source_chat_id:
          type: string
          description: |
            Chat / channel / user ID the bot exfiltrates to, as found in the sample
            (normalized). Empty if no chat ID was observed. It always stays the ID
            from the sample — if the group was later migrated to a supergroup, the
            chat metadata (`chat_name`, `admins`, …) reflects the current chat.
          example: "5283662956"
        source_chat_id_raw:
          type: string
          description: |
            Original chat-ID string from the sample **before** normalization (e.g.
            `5825611283%20`). Only set where normalization changed the value.
        chat_name:
          type: string
          description: Chat title (or first name for private chats) from `getChat`. Only where the bot could still query the chat.
        user_count:
          type: integer
          description: |
            Member count from `getChatMemberCount`. **`0` means "could not be
            retrieved"** (bot no longer in the chat, chat deleted, API error) — not
            zero members.
        admins:
          type: string
          description: |
            Space-separated `user_id:role` pairs from `getChatAdministrators`, e.g.
            `7862389560:administrator 6394819451:creator`. The `creator` ID is the
            strongest operator-attribution key.
          example: 7862389560:administrator 6394819451:creator
        pinned_message:
          type: string
          description: Text of the pinned message in the exfiltration chat, when retrievable. Often contains operator handles or service ads.
        commands:
          type: string
          description: Registered slash-commands from `getMyCommands` — often the C2 verb list of the malware panel.
          example: /start /logs /panel
        bot_description:
          type: string
          description: The bot's About text from `getMyDescription`. Often a service ad, seller handle or MaaS template.
        webhook:
          type: string
          description: |
            Delivery URL from `getWebhookInfo` if the bot uses webhook mode — a
            second piece of attacker infrastructure. Note that some are generic
            services (webhook.site, pipedream, bot builders).
        menu_webapp_url:
          type: string
          description: WebApp URL of the bot's menu button, when set — treat as an IOC.

        relay:
          type: string
          description: |
            Host name of a **Cloudflare Worker relay** the sample uses instead of
            calling `api.telegram.org` directly (e.g.
            `proxy.example.workers.dev`). Empty for direct connections.
          example: proxy.long7aa1.workers.dev
        relay_account:
          type: string
          description: Cloudflare Workers account sub-domain the relay belongs to (e.g. `long7aa1.workers.dev`) — groups relays of one operator.
          example: long7aa1.workers.dev

        investigation_name:
          type: string
          description: |
            Label of a named investigation or public report (actor / campaign case)
            the record has been associated with — either a short slug such as
            `heavygram-handala-2026` or a report title. Set only where a bot, chat
            or token match ties the record to that case — never by malware family
            alone. Empty for most records.
          example: heavygram-handala-2026
        investigation_url:
          type: string
          description: URL of the report or blog post behind `investigation_name`, when available.

        created:
          type: string
          format: date-time
          description: When the record entered this feed (UTC). Use for incremental sync.
          example: "2026-11-10 17:22:48.510Z"
        updated:
          type: string
          format: date-time
          description: When the record was last changed (UTC) — enrichment runs update it.
          example: "2026-11-11 07:19:49.312Z"

    Page:
      type: object
      properties:
        page: { type: integer, example: 1 }
        perPage: { type: integer, example: 30 }
        totalItems: { type: integer, description: "Total matching entries (-1 with skipTotal=true)." }
        totalPages: { type: integer, description: "Total pages (-1 with skipTotal=true)." }

    Sample:
      type: object
      properties:
        id: { type: string, example: 8v2kq1x9zt4m0ab }
        sha256:
          type: string
          description: SHA-256 of the malware sample (= `malware_file_hash` in records).
          example: e636c2bcfe5215b07ac6bbd83e8292c62fbf1e36354f57645278ddc040a15de7
        first_seen:
          type: string
          format: date-time
          description: First submission to VirusTotal (sample age, UTC).
          example: "2025-05-10 20:58:16.000Z"
        families: { type: string, description: "VirusTotal suggested family label; empty if none.", example: trojan.msil/asyncrat }
        threat_categories: { type: string, description: "Comma-separated VirusTotal threat categories.", example: "trojan, stealer" }
        triage: { type: string, description: "tria.ge analysis of this sample (matched by hash); empty if none.", example: "https://tria.ge/260824-3lmc7szzdz" }
        created:
          type: string
          format: date-time
          description: When this entry was first added (UTC).
        updated:
          type: string
          format: date-time
          description: When this entry last changed (UTC).

    Bot:
      type: object
      properties:
        id: { type: string, example: q7t2m9x4k1zb3ce }
        bot_id:
          type: string
          description: Numeric bot ID (the part before `:` in the token). Stable across token rotation.
          example: "8122935411"
        bot_name: { type: string, description: "Current username (last successful getMe). Empty if no token of this bot was ever valid.", example: anuZSteel_bot }
        permissions: { type: string, description: "Current getMe flags, verbatim.", example: "can_read_all_group_messages=false can_join_groups=true" }
        bot_description: { type: string, description: "Current About text (getMyDescription)." }
        commands: { type: string, description: "Current slash-commands (getMyCommands).", example: "/start /logs" }
        webhook: { type: string, description: "Current webhook URL; empty = long-polling or removed. Earlier values are in bot-history." }
        menu_webapp_url: { type: string, description: "Current menu-button WebApp URL." }
        created:
          type: string
          format: date-time
          description: When this entry was first added (UTC).
        updated:
          type: string
          format: date-time
          description: When this entry last changed (UTC).

    Token:
      type: object
      properties:
        id: { type: string, example: h3k9p2w7x0zq5ma }
        token: { type: string, description: "Token as observed, `bot<bot_id>:<secret>` (= `bot_token` in records).", example: "bot8122935411:AAH…" }
        bot_id: { type: string, description: "Bot this token belongs to.", example: "8122935411" }
        status:
          type: string
          enum: [unknown, ok, unauthorized, not_found, rate_limited, error]
          description: |
            Result of the latest getMe check (re-checked daily). `ok` = token valid,
            `unauthorized` / `not_found` = token dead or revoked.
        first_checked_alive: { type: string, format: date-time, description: "First check that found the token valid." }
        last_checked_alive: { type: string, format: date-time, description: "Last check that found the token valid." }
        first_checked_dead: { type: string, format: date-time, description: "First check that found the token dead (empty if never)." }
        last_checked: { type: string, format: date-time, description: "Latest check of any result." }
        checks_total: { type: integer, description: "Number of checks so far." }
        checks_alive: { type: integer, description: "Number of checks that found the token valid." }
        created:
          type: string
          format: date-time
          description: When this entry was first added (UTC).
        updated:
          type: string
          format: date-time
          description: When this entry last changed (UTC).

    Chat:
      type: object
      properties:
        id: { type: string, example: c4n8r1v6y2xq0tb }
        chat_id: { type: string, description: "Telegram chat ID (= `source_chat_id` in records).", example: "-1001614217318" }
        chat_type: { type: string, enum: [unknown, private, group, supergroup, channel] }
        chat_name: { type: string, description: "Current title (first name for private chats).", example: MeteorStealerTeam }
        chat_description: { type: string, description: "Current chat description / bio." }
        pinned_message: { type: string, description: "Current pinned message text." }
        admins: { type: string, description: "Current admins as `user_id:role` pairs.", example: "1965881969:creator" }
        admins_detail:
          type: [array, "null"]
          description: Current admins with Telegram profile data (null if never retrieved).
          items:
            type: object
            properties:
              user_id: { type: integer, example: 1965881969 }
              role: { type: string, enum: [creator, administrator] }
              username: { type: [string, "null"], example: nocta221 }
              first_name: { type: [string, "null"] }
              last_name: { type: [string, "null"] }
              is_bot: { type: boolean }
        user_count: { type: integer, description: "Member count; 0 = could not be retrieved." }
        last_status:
          type: string
          enum: [unknown, ok, chat_gone, forbidden, unauthorized, error, invalid_format]
          description: Result of the latest daily chat check.
        last_checked: { type: string, format: date-time, description: "Latest chat check." }
        last_diff_at: { type: string, format: date-time, description: "Latest check that detected a change." }
        created:
          type: string
          format: date-time
          description: When this entry was first added (UTC).
        updated:
          type: string
          format: date-time
          description: When this entry last changed (UTC).

    BotHistoryEvent:
      type: object
      properties:
        id: { type: string }
        bot_id: { type: string, example: "8122935411" }
        event_type: { type: string, enum: [username_changed, description_changed, commands_changed, webhook_changed, menu_url_changed] }
        old_value: { type: string, description: "Value before the change.", example: "https://perehodnik.click/managed/4e30…" }
        new_value: { type: string, description: "Value after the change (empty = removed).", example: "https://factorkz.com/managed/4e30…" }
        detected_at: { type: string, format: date-time, description: "When the change was detected (UTC)." }

    ChatHistoryEvent:
      type: object
      properties:
        id: { type: string }
        chat_id: { type: string, example: "-1001614217318" }
        event_type:
          type: string
          enum: [title_changed, description_changed, photo_changed, pinned_changed, admins_changed,
                 admin_added, admin_removed, admin_role_changed, chat_migrated, chat_rotated,
                 chat_gone, chat_restored]
        user_id: { type: string, description: "Affected user for admin_added / admin_removed / admin_role_changed." }
        old_value: { type: string, description: "Value before (for chat_migrated: the old chat ID)." }
        new_value: { type: string, description: "Value after (for chat_migrated: the new supergroup ID)." }
        detected_at: { type: string, format: date-time, description: "When the event was detected (UTC)." }

  examples:
    RecordListExample:
      value:
        page: 1
        perPage: 1
        totalItems: 56942
        totalPages: 56942
        items:
          - id: 6wt5fl4nyzq8n1u
            collectionName: Telegram
            bot_token: "bot8122935411:AAH…"
            bot_name: anuZSteel_bot
            private: false
            permissions: can_read_all_group_messages=false can_join_groups=true
            api_methods: sendDocument sendMessage
            malware_file_hash: "…"
            first_seen: "2025-05-10 20:58:16.000Z"
            families: trojan.msil/asyncrat
            threat_categories: trojan
            source_chat_id: "6835822112"
            user_count: 0
            created: "2025-12-03 08:23:00.696Z"
            updated: "2026-10-27 17:34:07.394Z"
