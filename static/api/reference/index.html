<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Reference · Telegram Threat-Intelligence Feed · mboll IT-Security</title>
  <meta name="description" content="OpenAPI reference for the read-only Telegram Threat-Intelligence Feed.">
  <meta name="robots" content="index,follow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: 'Newsreader'; src: url('/fonts/newsreader-var.woff2') format('woff2'); font-weight: 200 800; font-style: normal; font-display: swap; }
    @font-face { font-family: 'Newsreader'; src: url('/fonts/newsreader-italic-var.woff2') format('woff2'); font-weight: 200 800; font-style: italic; font-display: swap; }
    @font-face { font-family: 'JetBrains Mono'; src: url('/fonts/jetbrains-mono-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'JetBrains Mono'; src: url('/fonts/jetbrains-mono-500.woff2') format('woff2'); font-weight: 500; font-display: swap; }
    html, body { margin: 0; padding: 0; background: #f7f6f3; color: #16181a; }
    .topbar {
      display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
      padding: 14px 24px; border-bottom: 1px solid #dcdbd4; background: #fdfcfa;
      font-family: 'JetBrains Mono', monospace; font-size: 13px;
    }
    .topbar a { color: #16181a; text-decoration: none; }
    .topbar a:hover { color: #a3271e; }
    .topbar .brand { font-family: 'Newsreader', Georgia, serif; font-size: 19px; font-weight: 600; }
    noscript p { font-family: 'Newsreader', Georgia, serif; padding: 24px; }
  </style>
</head>
<body>
  <nav class="topbar">
    <a class="brand" href="/">mboll</a>
    <a href="/api/">← API guide</a>
    <a href="/api/openapi.yaml" download>openapi.yaml</a>
  </nav>
  <div id="redoc"></div>
  <noscript><p>This reference needs JavaScript. The raw specification is available as <a href="/api/openapi.yaml">openapi.yaml</a>.</p></noscript>
  <script src="/api/reference/redoc.standalone.js"></script>
  <script>
    Redoc.init('/api/openapi.yaml', {
      hideDownloadButton: false,
      expandResponses: '200',
      jsonSampleExpandLevel: 3,
      requiredPropsFirst: true,
      sortPropsAlphabetically: false,
      pathInMiddlePanel: true,
      hideHostname: false,
      disableSearch: false,
      theme: {
        spacing: { unit: 5, sectionHorizontal: 32, sectionVertical: 28 },
        colors: {
          primary: { main: '#a3271e' },
          text: { primary: '#16181a', secondary: '#797b76' },
          border: { dark: '#9d9c94', light: '#dcdbd4' },
          http: { get: '#a3271e' },
          responses: {
            success: { color: '#2f6b3a', backgroundColor: 'rgba(47,107,58,0.06)', tabTextColor: '#2f6b3a' },
            error:   { color: '#7f1e17', backgroundColor: 'rgba(163,39,30,0.06)', tabTextColor: '#a3271e' }
          }
        },
        typography: {
          fontSize: '16px',
          lineHeight: '1.6',
          fontFamily: "'Newsreader', Georgia, 'Times New Roman', serif",
          smoothing: 'antialiased',
          headings: { fontFamily: "'Newsreader', Georgia, serif", fontWeight: '600' },
          code: {
            fontFamily: "'JetBrains Mono', 'SF Mono', Menlo, monospace",
            fontSize: '13px', color: '#7f1e17', backgroundColor: 'rgba(163,39,30,0.06)', wrap: true
          },
          links: { color: '#a3271e', visited: '#7f1e17', hover: '#7f1e17' }
        },
        sidebar: {
          width: '270px', backgroundColor: '#fdfcfa', textColor: '#16181a',
          activeTextColor: '#a3271e', groupItems: { textTransform: 'uppercase' }
        },
        rightPanel: { backgroundColor: '#14161a', textColor: '#e3e5e8', width: '42%' },
        codeBlock: { backgroundColor: '#1c1f24' }
      }
    }, document.getElementById('redoc'));
  </script>
</body>
</html>
