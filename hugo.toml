baseURL = 'https://www.mboll.eu/'
languageCode = 'en-us'
title = 'mboll IT-Security'
theme = 'maverick'

# RSS Feed Configuration
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[outputFormats.RSS]
  mediaType = "application/rss+xml"
  baseName = "feed"

[services.rss]
  limit = 20

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 2

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 3

[params]
  items = 10
  author = "Manuel Boll"

[params.Author]
  name = "Manuel Boll"
  email = "hello@mboll.eu"
