baseURL = 'https://www.mboll.eu/'
languageCode = 'en-us'
title = 'mboll IT-Security'

[markup]
  [markup.highlight]
    style = "gruvbox"
    noClasses = true
    tabWidth = 4

# RSS Feed Configuration
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[outputFormats.RSS]
  mediaType = "application/rss+xml"
  baseName = "feed"

[services.rss]
  limit = 20

[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 2

  [[menu.main]]
    name = "API"
    url = "/api/"
    weight = 3

  [[menu.main]]
    name = "Blogroll"
    url = "/blogroll/"
    weight = 4

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 5

[params]
  items = 10
  authorName = "Manuel Boll"
  description = "IT-security research by Manuel Boll — malware analysis, reverse engineering, and threat intelligence on Telegram bots abused as C2 infrastructure."
  images = ["/img/og-default.png"]

[params.author]
  name = "Manuel Boll"
